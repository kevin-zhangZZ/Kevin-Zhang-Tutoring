    <script>
      // Set the theme before the first paint so dark-mode visitors never see a light flash.
      // Same rule as App.tsx: a theme the visitor picked wins, otherwise the device's setting.
      // Reading storage throws where site data is blocked; the device's setting still applies then.
      var stored = null
      try {
        stored = localStorage.getItem('theme')
      } catch (e) {}
      var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.classList.toggle('dark', dark)
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
    </script>
